          <h4>One conversion label is not enough</h4>
          <p>
            Website interaction, form submission, a qualified opportunity
            and a completed commercial outcome each answer different
            questions. The blueprint gives them separate definitions
            so the funnel can be measured stage by stage.
          </p>
          <span class="findings-label">Decision needed</span>
          <ul class="findings-list">
            <li>Agree on stage entry, completion and disqualification rules.</li>
            <li>Identify the system of record for each transition.</li>

        Workflow activity is a starting point, not the commercial result.
      </h3>

      <p>
        Automation enrolments and published statuses are observable in the
        workflow library. A reliable performance assessment still needs
        contact-level deduplication, lead quality rules, event completion,
        appointment and intake progression, and reconciliation with
        downstream case outcomes.
      </p>

      <div class="research-method-grid">
        <article class="research-method-card">
          <span class="research-method-number">01</span>
          <h4>Validate lead-source continuity</h4>
          <p>
            Test that campaign or form context is retained when a contact
            is created, tagged and handed to intake or sales operations.
          </p>
          <span class="method-detail">
            Source → CRM → qualified result
          </span>
        </article>

        <article class="research-method-card">
          <span class="research-method-number">02</span>
          <h4>Audit automation execution</h4>
          <p>
            Check trigger qualification, duplicate entry, branch conditions,
            exit logic, failure notifications and conditions requiring
            a human response.
          </p>
          <span class="method-detail">
            Successful routing and follow-up completion
          </span>
        </article>

        <article class="research-method-card">
          <span class="research-method-number">03</span>
          <h4>Evaluate progression by journey</h4>
          <p>
            Separate legal intake from event registration, quizzes, community
            engagement and former-client nurture, then report conversion
            metrics appropriate to each journey.
          </p>
          <span class="method-detail">
            Stage completion · bookings · case outcomes
